<!doctype html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CampusConnect | Placement Management</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
--bg:#f6f8fc;
--card:#ffffff;
--text:#111827;
--muted:#64748b;
--line:#e2e8f0;
--primary:#4f46e5;
--primary2:#7c3aed;
--soft:#eef2ff;
--nav:#ffffff;
--shadow:0 18px 50px #0f172a12;
}

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:'Plus Jakarta Sans',Inter,Segoe UI,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

body.dark{
--bg:#070b16;
--card:#0f172a;
--text:#f8fafc;
--muted:#94a3b8;
--line:#1e293b;
--soft:#151b35;
--nav:#0b1120;
--shadow:0 18px 50px #0005;
}

button,a,input,select,textarea{
font:inherit;
}

button{
cursor:pointer;
border:0;
}

a{
text-decoration:none;
color:inherit;
}

.container{
width:min(1180px,92%);
margin:auto;
}

/* NAVBAR */

.nav{
height:72px;
background:#ffffffee;
position:sticky;
top:0;
z-index:20;
border-bottom:1px solid var(--line);
backdrop-filter:blur(14px);
}

body.dark .nav{
background:#070b16ee;
}

.navin{
height:100%;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.brand{
display:flex;
align-items:center;
gap:11px;
font-weight:900;
font-size:19px;
}

.logo{
width:40px;
height:40px;
border-radius:13px;
background:linear-gradient(135deg,#312e81,#6366f1);
display:grid;
place-items:center;
color:#fff;
font-weight:900;
}

.links{
display:flex;
gap:25px;
color:var(--muted);
font-size:14px;
font-weight:700;
}

.links a:hover{
color:var(--primary);
}

.actions{
display:flex;
gap:9px;
align-items:center;
}

.btn{
padding:11px 17px;
border-radius:12px;
font-weight:800;
font-size:14px;
}

.primary{
background:var(--primary);
color:white;
}

.primary:hover{
background:#4338ca;
}

.outline{
border:1px solid var(--line);
background:var(--card);
color:var(--text);
}

.icon{
width:42px;
height:42px;
border:1px solid var(--line);
background:var(--card);
color:var(--text);
border-radius:12px;
}

/* HERO */

.hero{
background:linear-gradient(135deg,#eaf1ff,#eef2ff 55%,#f8faff);
color:#111827;
}

body.dark .hero{
background:linear-gradient(135deg,#111827,#312e81 55%,#4f46e5);
color:#fff;
}

.heroGrid{
padding:92px 0;
display:grid;
grid-template-columns:1.15fr .85fr;
gap:55px;
align-items:center;
}

.pill{
display:inline-block;
border:1px solid #c7d2fe;
background:#ffffffaa;
border-radius:30px;
padding:8px 13px;
font-size:11px;
font-weight:900;
letter-spacing:1.5px;
color:#4f46e5;
}

.hero h1{
font-size:clamp(42px,6vw,72px);
line-height:1.02;
margin:20px 0 18px;
letter-spacing:-3px;
}

.hero h1 span{
color:#4f46e5;
}

.hero p{
font-size:17px;
line-height:1.8;
color:#475569;
max-width:650px;
}

body.dark .hero p{
color:#dbeafe;
}

.heroBtns{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:28px;
}

.white{
background:#fff;
color:#3730a3;
}

.ghost{
background:#ffffffaa;
color:#3730a3;
border:1px solid #c7d2fe;
}

.stats{
display:flex;
gap:35px;
margin-top:45px;
}

.stats b{
font-size:26px;
}

.stats small{
display:block;
color:#64748b;
margin-top:5px;
}

body.dark .stats small{
color:#c7d2fe;
}

/* PREVIEW */

.preview{
background:#ffffff;
border:1px solid #dbe3f5;
border-radius:28px;
padding:18px;
box-shadow:0 25px 70px #4f46e51c;
}

body.dark .preview{
background:#ffffff14;
border:1px solid #ffffff25;
box-shadow:0 25px 70px #0005;
}

.previewTop{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
}

.live{
background:#dcfce7;
color:#15803d;
border-radius:20px;
padding:6px 10px;
font-size:10px;
font-weight:900;
}

.metric{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.metric div{
background:#f8fafc;
color:#111827;
border-radius:18px;
padding:22px;
}

.metric span{
font-size:12px;
color:#64748b;
}

.metric b{
display:block;
font-size:30px;
margin-top:8px;
}

.wide{
grid-column:1/-1;
background:linear-gradient(135deg,#4f46e5,#7c3aed)!important;
color:white!important;
}

/* SECTIONS */

.section{
padding:85px 0;
}

.center{
text-align:center;
}

.eyebrow{
color:var(--primary);
font-size:11px;
font-weight:900;
letter-spacing:1.7px;
text-transform:uppercase;
}

.section h2{
font-size:40px;
letter-spacing:-1.5px;
margin:10px 0;
}

.lead{
color:var(--muted);
line-height:1.8;
max-width:720px;
}

.center .lead{
margin:0 auto;
}

.about{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
align-items:center;
}

.aboutBox{
background:var(--card);
border:1px solid var(--line);
padding:28px;
border-radius:24px;
box-shadow:var(--shadow);
}

.features{
background:#eef2f7;
}

body.dark .features{
background:#0b1120;
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:40px;
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
padding:25px;
box-shadow:var(--shadow);
}

.card .ico{
font-size:29px;
}

.card h3{
margin:17px 0 7px;
}

.card p{
margin:0;
color:var(--muted);
line-height:1.65;
font-size:14px;
}

/* RECRUITERS */

.recruiters{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:13px;
margin-top:35px;
}

.company{
border:1px solid var(--line);
background:var(--card);
border-radius:18px;
padding:22px 10px;
text-align:center;
transition:.2s;
}

.company:hover{
transform:translateY(-4px);
border-color:#6366f1;
box-shadow:var(--shadow);
}

.companyIcon{
width:50px;
height:50px;
border-radius:15px;
background:var(--soft);
color:var(--primary);
display:grid;
place-items:center;
margin:auto;
font-weight:900;
font-size:20px;
}

.company small{
display:block;
color:var(--muted);
margin-top:8px;
}

/* CONTACT */

.contact{
background:linear-gradient(135deg,#111827,#312e81);
color:white;
}

.contactGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:35px;
}

.contactBox{
background:#ffffff12;
border:1px solid #ffffff20;
border-radius:25px;
padding:30px;
}

/* FOOTER */

.footer{
text-align:center;
padding:28px;
color:var(--muted);
font-size:13px;
line-height:1.8;
}

.footer .developer{
color:#4f46e5;
font-weight:900;
font-size:14px;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:#020617aa;
display:grid;
place-items:center;
padding:18px;
z-index:50;
}

.modalBox{
width:min(440px,100%);
background:var(--card);
border-radius:25px;
padding:28px;
box-shadow:0 30px 90px #0007;
max-height:92vh;
overflow:auto;
}

.modalHead{
display:flex;
justify-content:space-between;
gap:15px;
}

.close{
background:none;
color:var(--muted);
font-size:27px;
}

.tabs{
display:grid;
grid-template-columns:1fr 1fr;
background:var(--soft);
padding:4px;
border-radius:12px;
margin:20px 0;
}

.tabs button{
padding:10px;
border-radius:9px;
background:none;
color:var(--muted);
font-weight:800;
}

.tabs .active{
background:var(--card);
color:var(--text);
box-shadow:0 2px 8px #00000010;
}

.field{
width:100%;
padding:13px 14px;
border:1px solid var(--line);
border-radius:12px;
background:var(--bg);
color:var(--text);
outline:0;
margin-bottom:12px;
}

.field:focus{
border-color:#6366f1;
box-shadow:0 0 0 3px #6366f122;
}

.note{
font-size:12px;
color:var(--muted);
line-height:1.6;
}

.message{
padding:11px 13px;
border-radius:11px;
background:#fee2e2;
color:#991b1b;
font-size:13px;
margin-bottom:12px;
}

.success{
background:#dcfce7;
color:#166534;
}

/* DASHBOARD */

.dash{
min-height:100vh;
background:var(--bg);
}

.dashnav{
background:#0b1020;
color:#fff;
width:255px;
position:fixed;
inset:0 auto 0 0;
padding:25px 16px;
overflow-y:auto;
}

.dashmain{
margin-left:255px;
padding:35px;
}

.dashlinks button{
display:block;
width:100%;
text-align:left;
padding:12px 14px;
margin:4px 0;
border-radius:11px;
background:none;
color:#cbd5e1;
font-weight:700;
transition:.2s;
}

.dashlinks button.active,
.dashlinks button:hover{
background:#4f46e5;
color:white;
}

.dashCard{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:22px;
box-shadow:var(--shadow);
}

.dashGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.dashActionGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:20px;
}

.dashFeature{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:22px;
transition:.2s;
cursor:pointer;
}

.dashFeature:hover{
transform:translateY(-3px);
border-color:#6366f1;
box-shadow:var(--shadow);
}

.dashFeatureIcon{
width:48px;
height:48px;
display:grid;
place-items:center;
border-radius:14px;
background:var(--soft);
font-size:23px;
margin-bottom:14px;
}

.featureBtn{
margin-top:15px;
padding:9px 12px;
border-radius:10px;
background:var(--soft);
color:var(--primary);
font-size:12px;
font-weight:800;
}

.searchBox{
display:flex;
gap:10px;
margin:20px 0;
}

.searchBox .field{
margin:0;
}

.dataTable{
width:100%;
border-collapse:collapse;
margin-top:18px;
}

.dataTable th,
.dataTable td{
padding:13px 10px;
border-bottom:1px solid var(--line);
text-align:left;
font-size:13px;
}

.dataTable th{
color:var(--muted);
font-size:11px;
text-transform:uppercase;
letter-spacing:.5px;
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#dcfce7;
color:#166534;
font-size:10px;
font-weight:800;
}

.status.blue{
background:#dbeafe;
color:#1d4ed8;
}

.status.yellow{
background:#fef3c7;
color:#92400e;
}

.status.red{
background:#fee2e2;
color:#991b1b;
}

.actionRow{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:18px;
}

.smallBtn{
padding:8px 11px;
border-radius:9px;
font-size:11px;
font-weight:800;
background:var(--soft);
color:var(--primary);
}

.smallBtn.primaryBtn{
background:var(--primary);
color:#fff;
}

.emptyState{
text-align:center;
padding:40px 20px;
color:var(--muted);
}

.hide{
display:none!important;
}

/* PROFILE */

.profileHeader{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.profileCards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.profileCard{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:22px;
transition:.2s;
}

.profileCard:hover{
transform:translateY(-3px);
border-color:#6366f1;
box-shadow:var(--shadow);
}

.profileIcon{
width:48px;
height:48px;
border-radius:14px;
background:var(--soft);
display:grid;
place-items:center;
font-size:22px;
margin-bottom:15px;
}

.profileCard h3{
margin:0 0 7px;
}

.profileCard p{
color:var(--muted);
font-size:13px;
line-height:1.6;
min-height:42px;
}

.profileCard button{
background:var(--soft);
color:var(--primary);
padding:9px 12px;
border-radius:10px;
font-weight:800;
font-size:12px;
}

/* TOAST */

.toast{
position:fixed;
right:25px;
bottom:25px;
z-index:100;
background:#166534;
color:white;
padding:15px 20px;
border-radius:14px;
box-shadow:0 20px 50px #0005;
font-size:13px;
font-weight:700;
}

/* RESPONSIVE */

@media(max-width:1000px){

.recruiters{
grid-template-columns:repeat(3,1fr);
}

.dashActionGrid{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:900px){

.links{
display:none;
}

.heroGrid,
.about,
.contactGrid{
grid-template-columns:1fr;
}

.grid3{
grid-template-columns:1fr 1fr;
}

.dashnav{
display:none;
}

.dashmain{
margin:0;
padding:20px;
}

.dashGrid{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:800px){

.profileCards{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:600px){

.heroGrid{
padding:65px 0;
}

.hero h1{
letter-spacing:-2px;
}

.grid3{
grid-template-columns:1fr;
}

.recruiters{
grid-template-columns:repeat(2,1fr);
}

.stats{
gap:18px;
}

.actions .login{
display:none;
}

.section{
padding:65px 0;
}

.section h2{
font-size:31px;
}

.dashGrid,
.dashActionGrid{
grid-template-columns:1fr;
}

.dashmain{
padding:15px;
}

.searchBox{
flex-direction:column;
}

.dataTable{
font-size:11px;
}

.profileCards{
grid-template-columns:1fr;
}

.profileHeader{
align-items:flex-start;
flex-direction:column;
}

}

</style>

</head>

const root=document.getElementById('root');

let dark=localStorage.getItem('theme')==='dark';
let authMode='login';
let currentUser=null;
let currentRole=null;

if(dark){
document.body.classList.add('dark');
}

/* COMPANY LINKS */

const companies=[
['T','TCS','https://www.tcs.com/'],
['I','Infosys','https://www.infosys.com/'],
['A','Accenture','https://www.accenture.com/'],

['C','Capgemini','https://www.capgemini.com/']

/* DARK MODE */

function toggle(){

dark=!dark;

document.body.classList.toggle('dark',dark);

localStorage.theme=dark?'dark':'light';

}

/* NAVBAR */

function nav(){

return `

<header class="nav">

<div class="container navin">

<a class="brand" href="#" onclick="goHome()">

<span class="logo">C</span>

Campus
<span style="color:#4f46e5;margin-left:-8px">Connect</span>

</a>

<nav class="links">

<a href="#about">About</a>
<a href="#features">Features</a>
<a href="#recruiters">Recruiters</a>

</nav>

<div class="actions">

<button class="icon" onclick="toggle()">☾</button>

Login
</button>

<button class="btn primary" onclick="openAuth('register')">
Get Started
</button>

</div>

</div>

</header>

`;

}

/* HOME */

function home(){

return `

${nav()}

<section class="hero">

</div>

<div>
<b>1</b>
<small>Unified Platform</small>
</div>

</div>

</div>

<div class="preview">

<div class="previewTop">

<div>

<small style="color:#64748b">
PLACEMENT OVERVIEW
</small>

<h3 style="margin:5px 0">
Campus performance
</h3>

</div>

<span class="live">LIVE</span>

</div>

<div class="metric">

<div>
<span>Active jobs</span>
<b>120+</b>
</div>

<div>
<span>Recruiters</span>
<b>50+</b>
</div>

<div class="wide">

<span style="color:#c7d2fe">

</span>

<div style="height:8px;background:#ffffff35;border-radius:8px;margin-top:18px">

<div style="height:8px;width:80%;background:#fff;border-radius:8px"></div>

</div>

</div>

</div>

</div>

</div>

</section>

<section id="about" class="section">

<div class="container about">

<div>

<span class="eyebrow">About CampusConnect</span>

<h2>One system. Every placement workflow.</h2>

<p class="lead">

CampusConnect digitizes the placement journey
so students can discover opportunities,
companies can manage candidates,

</div>

<div class="aboutBox">

workflows without unnecessary complexity.

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">

/* LOGIN REGISTER */

async function handleAuth(e){

e.preventDefault();

const F=window.CampusFirebase;

if(!F){

showAuthMessage('Firebase is still loading. Please try again.');

return;

}

const email=document.getElementById('authEmail').value.trim();
const password=document.getElementById('authPassword').value;
const role=document.getElementById('authRole').value;

try{

if(authMode==='register'){

const name=document.getElementById('authName').value.trim();

if(role==='admin'){

const flag=await F.getDoc(
F.doc(F.db,'system','adminRegistration')
);

if(flag.exists() && flag.data().registered===true){

showAuthMessage(
'Admin registration is already completed. Only one admin registration is allowed.'
);

return;

}

}

const cred=await F.createUserWithEmailAndPassword(
F.auth,
email,
password
);

await F.setDoc(
F.doc(F.db,'users',cred.user.uid),
{
uid:cred.user.uid,
name:name,
email:email,
role:role,
createdAt:F.serverTimestamp()
}
);

if(role==='admin'){

await F.setDoc(
F.doc(F.db,'system','adminRegistration'),
{
registered:true,
uid:cred.user.uid,
deviceId:deviceId(),
createdAt:F.serverTimestamp()
}
);

}

showAuthMessage(
'Account created successfully. Opening your dashboard...',
true
);

setTimeout(()=>openDashboard(role,name),700);

}else{

const cred=await F.signInWithEmailAndPassword(
F.auth,
email,
password
);

const snap=await F.getDoc(
F.doc(F.db,'users',cred.user.uid)
);

if(!snap.exists()){

await F.signOut(F.auth);

showAuthMessage('User profile was not found in Firestore.');

return;

}

const data=snap.data();

if(data.role!==role){

await F.signOut(F.auth);

showAuthMessage(
'Selected role does not match this account.'
);

return;

}

showAuthMessage(
'Login successful. Opening dashboard...',
true
);

setTimeout(
()=>openDashboard(
data.role,
data.name||email
),
600
);

}

}catch(err){

let msg=err.message||'Authentication failed.';

msg=msg.replace('Firebase: ','').trim();

showAuthMessage(msg);

}

}

/* FORGOT PASSWORD */

async function forgotPassword(){

const email=document.getElementById('authEmail')?.value.trim();

if(!email){

showAuthMessage('Enter your email address first.');

return;

}

try{

await window.CampusFirebase.sendPasswordResetEmail(
window.CampusFirebase.auth,
email
);

showAuthMessage(
'Password reset email sent. Check your inbox.',
true
);

}catch(e){

let msg=
e.code==='auth/user-not-found'
?
'No account exists with this email.'
:
e.message;

showAuthMessage(msg);

}

}

/* SAVE */

async function saveFeature(event,title){

event.preventDefault();

const inputs=event.target.querySelectorAll('.featureInput');

const data={};

inputs.forEach((input,index)=>{
data["field"+index]=input.value;
});

try{

if(
window.CampusFirebase &&
window.CampusFirebase.auth.currentUser
){

const uid=window.CampusFirebase.auth.currentUser.uid;

await window.CampusFirebase.setDoc(

window.CampusFirebase.doc(
window.CampusFirebase.db,
'profiles',
uid
),

{
[title]:data,
updatedAt:window.CampusFirebase.serverTimestamp()
},

{merge:true}

);

}

}catch(error){

console.log('Firestore save error:',error);

}

document.getElementById('featureModal')?.remove();

document.body.insertAdjacentHTML(
'beforeend',
`

<div id="saveToast" class="toast">
✓ ${title} saved successfully
</div>

`
);

setTimeout(()=>{

document.getElementById('saveToast')?.remove();

},2500);

}

await window.CampusFirebase.signOut(
window.CampusFirebase.auth
);

}

}catch(e){

console.error(e);

}

currentUser=null;
currentRole=null;

goHome();

}

/* ESCAPE */

function escapeHtml(v){

return String(v).replace(
/[&<>"']/g,
function(m){

return {
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m];

}
);

}
